<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录成功 - 系统主界面</title>
    <style>
        :root {
            /* 主题色系 - 延续紫蓝渐变高级质感 */
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --primary-active: #3730A3;
            --primary-glow: rgba(79, 70, 229, 0.4);
            --primary-light: rgba(79, 70, 229, 0.1);

            /* 文本色系 */
            --text-main: #0F172A;
            --text-secondary: #475569;
            --text-tertiary: #94A3B8;

            /* UI元素色系 */
            --border-color: rgba(148, 163, 184, 0.2);
            --border-highlight: rgba(255, 255, 255, 0.8);
            --sidebar-bg: rgba(255, 255, 255, 0.6);
            --header-bg: rgba(255, 255, 255, 0.4);
            --card-bg: rgba(255, 255, 255, 0.7);

            /* 阴影效果 */
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.05);

            /* 几何参数 */
            --glass-blur: 24px;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;

            /* 动画曲线 */
            --fluid-easing: cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #6366F1;
                --primary-hover: #818CF8;
                --primary-glow: rgba(99, 102, 241, 0.3);
                --primary-light: rgba(99, 102, 241, 0.15);

                --text-main: #F8FAFC;
                --text-secondary: #CBD5E1;
                --text-tertiary: #64748B;

                --border-color: rgba(148, 163, 184, 0.15);
                --border-highlight: rgba(255, 255, 255, 0.05);
                --sidebar-bg: rgba(15, 23, 42, 0.6);
                --header-bg: rgba(15, 23, 42, 0.4);
                --card-bg: rgba(30, 41, 59, 0.6);
            }
        }

        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Inter", "SF Pro Display", -apple-system, sans-serif;
            background-color: #F1F5F9;
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden; /* 防止整个页面滚动，内部区域滚动 */
            display: flex;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0B1120;
                background-image:
                    radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                    radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            }
        }

        /* ==================== 侧边栏布局 ==================== */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: var(--sidebar-bg);
            backdrop-filter: blur(var(--glass-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
            border-right: 1px solid var(--border-highlight);
            box-shadow: 4px 0 24px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 100;
            transition: all 0.3s var(--fluid-easing);
        }

        .sidebar-logo {
            height: 72px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--primary), #818CF8);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: white;
            box-shadow: 0 4px 10px var(--primary-glow);
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .sidebar-nav {
            flex: 1;
            padding: 24px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-group-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 12px 0 8px 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s var(--fluid-easing);
            cursor: pointer;
            border: 1px solid transparent;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.5);
            color: var(--text-main);
        }
        @media (prefers-color-scheme: dark) { .nav-item:hover { background: rgba(255,255,255,0.05); } }

        .nav-item.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
            border-color: rgba(79, 70, 229, 0.2);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.5);
        }
        @media (prefers-color-scheme: dark) { .nav-item.active { box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); } }

        .nav-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-badge {
            margin-left: auto;
            background: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 20px;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.4);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }
        @media (prefers-color-scheme: dark) { .user-profile { background: rgba(0,0,0,0.2); } }
        .user-profile:hover { background: var(--card-bg); }

        .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10B981, #34D399);
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
        }

        .user-info { flex: 1; overflow: hidden; }
        .user-name { font-size: 14px; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .user-role { font-size: 12px; color: var(--text-tertiary); }


        /* ==================== 右侧主内容区 ==================== */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 顶部导航条 */
        .top-header {
            height: 72px;
            background: var(--header-bg);
            backdrop-filter: blur(var(--glass-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
            border-bottom: 1px solid var(--border-highlight);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 90;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            width: 38px; height: 38px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .icon-btn:hover {
            color: var(--primary);
            border-color: var(--primary-light);
            background: white;
        }

        /* 内部内容滚动区 */
        .content-area {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* 演示用的仪表盘卡片布局 */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-highlight);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s var(--fluid-easing), box-shadow 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .stat-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: var(--primary-light);
            color: var(--primary);
            display: flex; align-items: center; justify-content: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .stat-desc {
            font-size: 13px;
            color: var(--text-tertiary);
            display: flex; align-items: center; gap: 6px;
        }

        .trend-up { color: #10B981; font-weight: 600; background: rgba(16,185,129,0.1); padding: 2px 6px; border-radius: 4px; }
        .trend-down { color: #E11D48; font-weight: 600; background: rgba(225,29,72,0.1); padding: 2px 6px; border-radius: 4px; }

        /* 底部巨大占位区域（模拟图表或主表格内容） */
        .main-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-highlight);
            border-radius: var(--radius-lg);
            padding: 24px;
            min-height: 400px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
        }

        .main-panel svg {
            margin-bottom: 16px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <!-- 左侧导航栏 -->
    <aside class="sidebar">
        <!-- Logo区 -->
        <div class="sidebar-logo">
            <div class="logo-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                </svg>
            </div>
            <div class="logo-text">API Console</div>
        </div>

        <!-- 菜单区 -->
        <nav class="sidebar-nav">
            <div class="nav-group-title">核心业务</div>

            <a href="#" class="nav-item">
                <div class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></div>

            </a>

                <span class="nav-badge">12</span>
            </a>

            <a href="#" class="nav-item">
                <div class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg></div>
                渠道管理
            </a>

            <div class="nav-group-title">数据与日志</div>

            <a href="#" class="nav-item">

                数据统计
            </a>

            <a href="#" class="nav-item">
                <div class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg></div>
                调用日志
            </a>

            <div class="nav-group-title">系统设置</div>

            <a href="#" class="nav-item">
                <div class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></div>
                设置中心
            </a>
        </nav>

        <!-- 底部用户信息区 -->
        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="avatar">A</div>
                <div class="user-info">
                    <div class="user-name">Admin User</div>
                    <div class="user-role">超级管理员</div>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </div>
    </aside>

    <!-- 右侧主界面 -->
    <main class="main-wrapper">

        <!-- 顶部通栏 -->
        <header class="top-header">
            <div class="header-left">
                <div class="page-title">首页总览</div>
            </div>

            <div class="header-actions">
                <button class="icon-btn" title="通知消息">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </button>
                <button class="icon-btn" title="切换主题">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
                <button class="icon-btn" style="background: var(--primary); color: white; border: none; box-shadow: 0 4px 10px var(--primary-glow);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                </button>
            </div>
        </header>

        <!-- 主内容容器（此处可放置令牌管理的表格，这里演示仪表盘数据） -->

            <div class="grid-cards">
                <div class="stat-card">
                    <div class="stat-header">
                        <span>今日消耗额度</span>
                        <div class="stat-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div>
                    </div>
                    <div class="stat-value">$1,284.50</div>
                    <div class="stat-desc">
                        <span class="trend-up">↑ 12.5%</span> 较昨日同时段
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span>总调用次数</span>
                        <div class="stat-icon" style="background: rgba(16,185,129,0.1); color: #10B981;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg></div>
                    </div>
                    <div class="stat-value">845,201</div>
                    <div class="stat-desc">
                        <span class="trend-up">↑ 5.2%</span> 较上周平均
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span>活动令牌数</span>
                        <div class="stat-icon" style="background: rgba(245,158,11,0.1); color: #F59E0B;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>
                    </div>
                    <div class="stat-value">142</div>
                    <div class="stat-desc">
                        <span class="trend-down">↓ 2</span> 个已过期/禁用
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span>API 延迟</span>
                        <div class="stat-icon" style="background: rgba(148,163,184,0.1); color: var(--text-secondary);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div>
                    </div>
                    <div class="stat-value">245ms</div>
                    <div class="stat-desc">
                        <span style="color:var(--text-tertiary)">健康状态：</span><span style="color:#10B981;font-weight:600">极佳</span>
                    </div>
                </div>
            </div>

            <!-- 主展区占位 (代表之前令牌管理那张大表的位置) -->
            <div class="main-panel">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                <h2>主内容展示区</h2>
                <p style="margin-top:8px;">这里可以无缝嵌入你之前做的《令牌管理表格》、图表或日志模块</p>
            </div>

        </div>
    </main>

</body>
