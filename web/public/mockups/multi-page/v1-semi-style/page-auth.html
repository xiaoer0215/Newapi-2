<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统控制台 - 身份验证</title>
    <style>
        :root {
            --primary: #006FEE;
            --primary-hover: #005BC4;
            --primary-active: #004493;
            --primary-glow: rgba(0, 111, 238, 0.4);
            --text-main: #11181C;
            --text-secondary: #687076;
            --text-tertiary: #879097;
            --border-color: rgba(0, 0, 0, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.8);
            --card-bg: rgba(255, 255, 255, 0.65);
            --input-bg: rgba(255, 255, 255, 0.7);
            --input-bg-focus: #ffffff;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.04), 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 24px 48px rgba(0, 0, 0, 0.08), 0 12px 24px rgba(0, 0, 0, 0.06);
            --btn-outline-bg: rgba(255, 255, 255, 0.5);
            --glass-blur: 48px;
            --radius-card: 28px;
            --radius-btn: 14px;
            --radius-input: 16px;
            --spring-easing: cubic-bezier(0.175, 0.885, 0.32, 1.15); /* 更完美的弹簧 */
            --fluid-easing: cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #006FEE; /* 深色下依然保持鲜艳的克莱因蓝 */
                --primary-hover: #338EF7;
                --primary-glow: rgba(0, 111, 238, 0.5);
                --text-main: #ECEDEE;
                --text-secondary: #9BA1A6;
                --text-tertiary: #71767A;
                --border-color: rgba(255, 255, 255, 0.1);
                --border-highlight: rgba(255, 255, 255, 0.05);
                --card-bg: rgba(17, 17, 17, 0.6);
                --input-bg: rgba(255, 255, 255, 0.03);
                --input-bg-focus: rgba(255, 255, 255, 0.08);
                --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 32px 64px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
                --btn-outline-bg: rgba(255, 255, 255, 0.03);
            }
        }

        /* 顶级字体排版设置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f4f6f8;
            background-image: radial-gradient(at 0% 0%, hsla(210, 100%, 95%, 1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(220, 100%, 93%, 1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(240, 100%, 95%, 1) 0, transparent 50%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main); padding: 20px;
            position: relative; z-index: 1; overflow: hidden;
        }

        @media (prefers-color-scheme: dark) { body { background-color: #000000; } }

        /* 细节1：高级噪点纹理材质 (Noise Texture) - Stripe/Linear 都在用 */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 0; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        @media (prefers-color-scheme: dark) { .noise-overlay { opacity: 0.05; } }

        /* 细节2：极光流体背景 (Aurora Background) */
        .bg-shapes {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; pointer-events: none;
        }
        .shape {
            position: absolute; border-radius: 50%; filter: blur(90px);
            animation: auroraFloat 25s infinite alternate var(--fluid-easing);
            opacity: 0.7;
        }
        @media (prefers-color-scheme: dark) { .shape { opacity: 0.35; filter: blur(120px); } }
        .shape-1 { width: 70vw; height: 70vw; background: #E1F0FF; top: -20vh; left: -10vw; animation-delay: 0s; }
        .shape-2 { width: 60vw; height: 60vw; background: #F3E8FF; bottom: -20vh; right: -10vw; animation-delay: -5s; }
        .shape-3 { width: 50vw; height: 50vw; background: #E0E7FF; top: 40vh; left: 30vw; animation-delay: -10s; }

        @media (prefers-color-scheme: dark) {
            .shape-1 { background: #004493; }
            .shape-2 { background: #3B096C; }
            .shape-3 { background: #112240; }
        }

        @keyframes auroraFloat {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(5vw, 10vh) scale(1.1) rotate(10deg); }
            100% { transform: translate(-5vw, 5vh) scale(0.9) rotate(-10deg); }
        }

        .auth-wrapper { width: 100%; max-width: 440px; perspective: 1200px; z-index: 10; }

        /* 殿堂级卡片 */
        .auth-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.3));
            backdrop-filter: blur(var(--glass-blur)) saturate(150%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
            border: 1px solid var(--border-highlight);
            border-radius: var(--radius-card);
            padding: 48px 40px 40px;
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.8);
            text-align: center;
            animation: cardEntrance 1s var(--spring-easing) both;
            position: relative;
        }
        @media (prefers-color-scheme: dark) {
            .auth-card { background: linear-gradient(145deg, var(--card-bg), rgba(20, 20, 20, 0.8)); }
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(60px) scale(0.94) rotateX(8deg); }
            to { opacity: 1; transform: translateY(0) scale(1) rotateX(0); }
        }

        h1 {
            font-size: 30px; font-weight: 800; color: var(--text-main);
            margin-bottom: 8px; letter-spacing: -1px;
            transition: opacity 0.3s;
        }

        .subtitle {
            font-size: 15px; color: var(--text-secondary);
            margin-bottom: 32px; font-weight: 500; letter-spacing: -0.2px;
            transition: opacity 0.3s;
        }

        /* iOS 原生级 Tab 切换 */
        .auth-tabs {
            position: relative; display: flex; margin-bottom: 32px;
            background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: calc(var(--radius-btn) + 4px); padding: 5px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .auth-tab {
            position: relative; z-index: 2; flex: 1; text-align: center;
            padding: 12px 0; font-size: 14px; font-weight: 600;
            color: var(--text-tertiary); cursor: pointer;
            border-radius: var(--radius-btn); transition: color 0.4s ease;
            letter-spacing: -0.2px;
        }
        .auth-tab.active { color: var(--text-main); }

        .tab-indicator {
            position: absolute; top: 5px; bottom: 5px; width: calc(50% - 5px);
            background: var(--input-bg-focus); border-radius: var(--radius-btn);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.04);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1;
        }
        @media (prefers-color-scheme: dark) {
            .tab-indicator { box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1); }
        }
        .auth-tabs[data-active="login"] .tab-indicator { transform: translateX(0); }
        .auth-tabs[data-active="register"] .tab-indicator { transform: translateX(100%); }

        /* 输入框 - 恢复经典清爽边框 */
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-input-wrapper {
            position: relative; display: flex; align-items: center;
            border: 1px solid var(--border-color); border-radius: var(--radius-input);
            padding: 0 14px; background: var(--input-bg);
            transition: all 0.3s ease;
        }
        .form-input-wrapper:focus-within {
            border-color: var(--primary); background: var(--input-bg-focus);
            box-shadow: 0 4px 12px rgba(22, 119, 255, 0.06), 0 0 0 3px rgba(0, 111, 238, 0.12), inset 0 2px 4px rgba(0,0,0,0.02);
            transform: translateY(-1px);
        }
        .input-icon {
            color: var(--text-tertiary); width: 18px; height: 18px;
            transition: all 0.3s ease;
        }
        .form-input-wrapper:focus-within .input-icon {
            color: var(--primary); transform: scale(1.1);
        }
        /* 动态发光聚焦光标 (Focus Glow Cursor) */
        .form-input {
            flex: 1; border: none; outline: none;
            padding: 14px 10px; font-size: 14.5px; font-weight: 500;
            color: var(--text-main); background: transparent; letter-spacing: -0.1px;
            transition: padding-left 0.4s var(--spring-easing);
            caret-color: var(--primary);
        }
        .form-input:focus {
            padding-left: 14px;
        }
        .form-input::placeholder { color: var(--text-tertiary); font-weight: 400; opacity: 0.8; }

        /* 密码可见性切换按钮 */
        .pwd-toggle {
            color: var(--text-tertiary); cursor: pointer;
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: all 0.3s ease; margin-right: -4px;
        }
        .pwd-toggle:hover { color: var(--text-main); background: rgba(0,0,0,0.06); }
        @media (prefers-color-scheme: dark) { .pwd-toggle:hover { background: rgba(255,255,255,0.1); } }
        .pwd-toggle svg { width: 18px; height: 18px; transition: transform 0.2s; }
        .pwd-toggle:active svg { transform: scale(0.85); }

        .btn-get-code {
            border: none; background: transparent;
            color: var(--primary); font-size: 13.5px; cursor: pointer;
            padding: 6px 12px; margin-right: -4px; white-space: nowrap; font-weight: 600;
            transition: all 0.3s var(--spring-easing); border-radius: 8px;
        }
        .btn-get-code:hover {
            color: var(--primary-hover); background: rgba(0, 111, 238, 0.08);
            transform: translateY(-1px);
        }
        .btn-get-code:active {
            transform: scale(0.96); background: rgba(0, 111, 238, 0.12);
        }

        .login-actions-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 28px; margin-top: 8px;
        }
        .login-actions-row .terms-label { margin-bottom: 0; }

        .link {
            color: var(--text-secondary); text-decoration: none;
            transition: all 0.3s; font-weight: 600; font-size: 13.5px; cursor: pointer;
        }
        .link:hover { color: var(--primary); text-decoration: underline; text-underline-offset: 4px; }
        .forgot-pwd-link { white-space: nowrap; margin-left: 12px; flex-shrink: 0; }

        /* 苹果级 Checkbox */
        .terms-label {
            display: flex; align-items: center; gap: 10px; margin-bottom: 24px;
            text-align: left; cursor: pointer; user-select: none;
        }
        .terms-label input[type="checkbox"] { display: none; }
        .custom-checkbox {
            width: 20px; height: 20px; border: 2px solid var(--text-secondary);
            border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.4s var(--spring-easing); flex-shrink: 0;
            background: transparent; position: relative;
        }
        .terms-label:hover .custom-checkbox { border-color: var(--text-main); }
        .terms-label input[type="checkbox"]:checked + .custom-checkbox {
            background: var(--primary); border-color: var(--primary);
            box-shadow: 0 4px 12px var(--primary-glow); transform: scale(1.05);
        }
        .custom-checkbox svg {
            width: 12px; height: 12px; fill: none; stroke: white;
            stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 0.3s ease 0.1s;
        }
        .terms-label input[type="checkbox"]:checked + .custom-checkbox svg { stroke-dashoffset: 0; }
        .terms-text { font-size: 13.5px; color: var(--text-secondary); font-weight: 500; letter-spacing: -0.1px;}
        .terms-text .link { color: var(--primary); text-decoration: none; }
        .terms-text .link:hover { text-decoration: underline; }

        /* 核心大按钮 - 动态箭头与微渐变 */
        .btn {
            width: 100%; height: 52px; border-radius: var(--radius-btn);
            font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: 0.5px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.4s var(--spring-easing); border: none;
            margin-bottom: 28px; position: relative; overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(180deg, var(--primary-hover), var(--primary));
            color: #ffffff;
            box-shadow: 0 8px 20px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,0.3);
        }
        .btn-primary svg {
            width: 18px; height: 18px; transition: transform 0.4s var(--spring-easing);
            opacity: 0.8;
        }
        /* 恢复按钮扫光动效 */
        .btn-primary::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg); transition: left 0.7s cubic-bezier(0.19, 1, 0.22, 1); z-index: 1;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,0.4);
            background: linear-gradient(180deg, #338EF7, var(--primary-hover));
        }
        .btn-primary:hover::before { left: 200%; }
        .btn-primary:hover svg { transform: translateX(4px); opacity: 1; }
        .btn-primary:active { transform: translateY(1px) scale(0.98); box-shadow: 0 4px 12px var(--primary-glow); }

        /* 渐变分割线 */
        .divider {
            display: flex; align-items: center; margin: 24px 0;
            color: var(--text-tertiary); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-color) 50%, var(--border-color));
        }
        .divider::after { background: linear-gradient(270deg, transparent, var(--border-color) 50%, var(--border-color)); }
        .divider span { padding: 0 16px; }

        /* 底部快捷小图标 - 恢复极品动效 */
        .quick-icons { display: flex; justify-content: center; gap: 24px; margin-bottom: 8px; }
        .quick-icon-btn {
            width: 52px; height: 52px; border-radius: 50%;
            border: 1px solid var(--border-color); background: var(--input-bg);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.4s var(--spring-easing);
            color: var(--text-secondary); backdrop-filter: blur(12px);
            box-shadow: var(--shadow-sm); position: relative;
        }
        .quick-icon-btn::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: inherit; filter: blur(10px); opacity: 0; transition: opacity 0.4s; z-index: -1;
        }
        .quick-icon-btn svg { width: 24px; height: 24px; transition: transform 0.4s var(--spring-easing); }
        .quick-icon-btn:hover {
            background: var(--input-bg-focus);
            transform: translateY(-4px) scale(1.05);
            box-shadow: var(--shadow-md);
        }
        .quick-icon-btn:hover svg { transform: scale(1.15); }
        .quick-icon-btn.wechat:hover {
            border-color: rgba(7,193,96,0.4); color: #07C160; background: rgba(7,193,96,0.08);
        }
        .quick-icon-btn.wechat:hover::after { background: #07C160; opacity: 0.2; }
        .quick-icon-btn.github:hover {
            border-color: var(--text-main); color: var(--text-main); background: rgba(0,0,0,0.04);
        }
        @media (prefers-color-scheme: dark) {
            .quick-icon-btn.github:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.3); }
            .quick-icon-btn.github:hover::after { background: #ffffff; opacity: 0.15; }
        }

        /* ====== 高级：错位交替入场动画 (Staggered Animation) ====== */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .tab-content.active .animated-item {
            opacity: 0; animation: slideUpBlur 0.6s var(--spring-easing) forwards;
        }
        /* 为每一个元素分配延迟，形成瀑布流展现 */
        .tab-content.active .animated-item:nth-child(1) { animation-delay: 0.05s; }
        .tab-content.active .animated-item:nth-child(2) { animation-delay: 0.10s; }
        .tab-content.active .animated-item:nth-child(3) { animation-delay: 0.15s; }
        .tab-content.active .animated-item:nth-child(4) { animation-delay: 0.20s; }
        .tab-content.active .animated-item:nth-child(5) { animation-delay: 0.25s; }
        .tab-content.active .animated-item:nth-child(6) { animation-delay: 0.30s; }
        .tab-content.active .animated-item:nth-child(7) { animation-delay: 0.35s; }
        .tab-content.active .animated-item:nth-child(8) { animation-delay: 0.40s; }

        @keyframes slideUpBlur {
            from { opacity: 0; transform: translateY(15px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .back-to-login { text-align: center; margin-top: 24px; }
        .back-to-login .link { display: inline-flex; align-items: center; font-size: 14px; }
        .back-to-login svg { transition: transform 0.3s var(--spring-easing); }
        .back-to-login .link:hover svg { transform: translateX(-4px); }

    </style>
</head>
<body>

    <!-- 极简噪点纹理 -->
    <div class="noise-overlay"></div>

    <!-- 极光流体背景 -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 id="auth-title">欢迎回来</h1>
            <p class="subtitle" id="auth-subtitle">请登录您的系统控制台账号</p>

            <!-- 核心功能 Tabs 切换 - 带有滑动指示器 -->
            <div class="auth-tabs" id="auth-tabs" data-active="login">
                <div class="tab-indicator"></div>
                <div class="auth-tab active" onclick="switchView('login')">登 录</div>
                <div class="auth-tab" onclick="switchView('register')">注 册</div>
            </div>

            <!-- ===================== 1. 登录面板 ===================== -->
            <div id="view-login" class="tab-content active">

                <div class="form-group animated-item">
                    <div class="form-input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" class="form-input" placeholder="邮箱或用户名">
                    </div>
                </div>

                <div class="form-group animated-item" style="margin-bottom: 8px;">
                    <div class="form-input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" class="form-input" placeholder="输入密码">
                        <div class="pwd-toggle" onclick="togglePwd(this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </div>
                    </div>
                </div>

                <div class="login-actions-row animated-item">
                    <label class="terms-label" for="login-terms-pwd">
                        <input type="checkbox" id="login-terms-pwd">
                        <div class="custom-checkbox">
                            <svg viewBox="0 0 12 10"><polyline points="1.5 6 4.5 9 10.5 1"></polyline></svg>
                        </div>
                        <span class="terms-text">阅读并同意 <a href="#" class="link" onclick="event.stopPropagation()">服务条款</a> & <a href="#" class="link" onclick="event.stopPropagation()">隐私政策</a></span>
                    </label>
                    <span class="link forgot-pwd-link" onclick="switchView('reset')">忘记密码？</span>
                </div>

                <button class="btn btn-primary animated-item">
                    登 录
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>

                <div class="divider animated-item"><span>其他方式登录</span></div>

                <!-- 快捷登录小图标 -->
                <div class="quick-icons animated-item">
                    <div class="quick-icon-btn wechat" title="微信登录">

                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>

                        返回登录

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.replace('#', '');
            if (['login', 'register', 'reset'].includes(hash)) {
                switchView(hash);
            } else {
                switchView('login');
            }
        });

        function switchView(view) {
            window.location.hash = view;

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.auth-tab').forEach(el => el.classList.remove('active'));

            const tabsContainer = document.getElementById('auth-tabs');
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');

            const titleMap = {
                'login': { main: '欢迎回来', sub: '请登录您的系统控制台账号' },
                'register': { main: '注册新账号', sub: '创建您的系统控制台账号' },
                'reset': { main: '找回密码', sub: '重置您的账号密码' }
            };

            if (view === 'reset') {
                tabsContainer.style.display = 'none';
            } else {
                tabsContainer.style.display = 'flex';
                const tabIndex = view === 'login' ? 0 : 1;
                document.querySelectorAll('.auth-tab')[tabIndex].classList.add('active');
                tabsContainer.setAttribute('data-active', view);
            }

            // 触发瀑布流入场动画
            const targetView = document.getElementById('view-' + view);
            targetView.classList.add('active');

            // 重置动画使其每次点击都生效
            const animatedItems = targetView.querySelectorAll('.animated-item');
            animatedItems.forEach(item => {
                item.style.animation = 'none';
                item.offsetHeight; /* trigger reflow */
                item.style.animation = null;
            });

            title.style.opacity = '0';
            subtitle.style.opacity = '0';
            setTimeout(() => {
                title.innerText = titleMap[view].main;
                subtitle.innerText = titleMap[view].sub;
                title.style.opacity = '1';
                subtitle.style.opacity = '1';
            }, 150);
        }

        // 密码可见性切换
        function togglePwd(btn) {
            const input = btn.previousElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            }
        }
    </script>
